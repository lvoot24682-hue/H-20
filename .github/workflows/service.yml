name: WOLF Event Bot

on:
  schedule:
    - cron: "0 */4 * * *"   # كل 4 ساعات
  workflow_dispatch:

concurrency:
  group: wolf-event-bot
  cancel-in-progress: true   # يقتل النسخة السابقة تلقائيًا

jobs:
  wolf:
    runs-on: ubuntu-latest

    # 5 ساعات + هامش (الحد المجاني 6 ساعات)
    timeout-minutes: 330

    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # Node.js
      # ======================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ======================================================
      # Install Dependencies
      # ======================================================
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm install
          echo "🌐 Installing Playwright Chromium..."
          npx playwright install --with-deps chromium
          echo "✅ Dependencies installed"

      # ======================================================
      # ★ Restore WOLF Profile from Cache
      # ======================================================
      - name: Restore WOLF profile from cache
        id: profile-cache
        uses: actions/cache/restore@v4
        with:
          path: ./wolf-runtime
          key: wolf-event-profile-${{ github.run_id }}
          restore-keys: |
            wolf-event-profile-

      - name: Profile cache status
        run: |
          if [ -d "./wolf-runtime/profile" ] && [ -n "$(ls -A ./wolf-runtime/profile 2>/dev/null)" ]; then
            echo "✅ Cache موجود — سيتم استخدام البروفايل المُحدَّث"
            du -sh ./wolf-runtime/profile || true
          else
            echo "ℹ️ لا يوجد Cache — سيتم التنزيل من Google Drive"
          fi

      # ======================================================
      # Check Profile URL
      # ======================================================
      - name: Check WOLF Profile Secret
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL is NOT available"
            exit 1
          fi
          echo "✅ WOLF_PROFILE_URL is available"

      # ======================================================
      # Run Bot
      # ======================================================
      - name: Run WOLF Event Task
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          echo "========================================"
          echo "🐺 WOLF EVENT BOT"
          echo "========================================"
          echo "🕐 Start: $(date -u)"
          echo "📱 DEVICE: web"
          echo "🛡️ APP CHECK: true"
          echo "========================================"

          # ★ تشغيل البوت مع حد زمني داخلي (5 ساعات)
          RUN_SECONDS=18000
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + RUN_SECONDS))

          cleanup() {
            echo ""
            echo "🧹 WOLF CLEANUP"
            if [ -n "$BOT_PID" ] && kill -0 "$BOT_PID" 2>/dev/null; then
              echo "📡 Sending SIGTERM to PID $BOT_PID..."
              kill -TERM -- "-$BOT_PID" 2>/dev/null || true
              sleep 8
              if kill -0 "$BOT_PID" 2>/dev/null; then
                echo "💀 Sending SIGKILL..."
                kill -KILL -- "-$BOT_PID" 2>/dev/null || true
              fi
            fi
            echo "✅ Cleanup done"
          }
          trap cleanup EXIT INT TERM

          setsid npm start &
          BOT_PID=$!
          echo "🐺 WOLF PID: $BOT_PID"

          while true; do
            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "⏰ 5 HOURS COMPLETED at $(date -u)"
              exit 0
            fi

            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "⚠️ WOLF STOPPED UNEXPECTEDLY"
              wait "$BOT_PID" 2>/dev/null || true
              exit 1
            fi

            ELAPSED=$((NOW - START_TIME))
            H=$((ELAPSED / 3600))
            M=$(((ELAPSED % 3600) / 60))
            S=$((ELAPSED % 60))
            echo "🐺 WOLF running | ⏱️ ${H}h ${M}m ${S}s | $(date -u)"
            sleep 30
          done

      # ======================================================
      # ★ Save WOLF Profile to Cache
      # ======================================================
      - name: Save WOLF profile to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./wolf-runtime
          key: wolf-event-profile-${{ github.run_id }}

      # ======================================================
      # Final Cleanup
      # ======================================================
      - name: Final Cleanup
        if: always()
        run: |
          echo "🧹 FINAL CLEANUP"
          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true
          echo "✅ Final cleanup completed"
